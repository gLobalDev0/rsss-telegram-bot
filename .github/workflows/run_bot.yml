name: RSS Telegram Bot

on:
  schedule:
    - cron: '0 * * * *'  # Her saat başı çalışır
  workflow_dispatch:      # Elle de tetiklenebilir

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Kodları Kopyala
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Kütüphaneleri Yükle (Pip Install)
        run: |
          pip install -r requirements.txt

      - name: Botu Çalıştır
        run: python look_bot.py

      - name: Gönderilenleri Kaydet ve GitHub'a Güncelle
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_posts.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update sent posts history" && git push)
